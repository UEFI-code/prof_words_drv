name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: sudo apt install build-essential linux-headers-$(uname -r) -y
    - name: Build
      run: make
    - name: Run tests
      run: |
        sudo make install
        sleep 160
        sudo make uninstall